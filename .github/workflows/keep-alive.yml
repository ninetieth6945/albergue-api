name: mantener API despierta

# El plan Free de Render duerme el servicio tras 15 minutos sin tráfico.
# Este ping cada 10 minutos lo mantiene despierto (744 h/mes < límite de 750 h).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: GET /healthz
        run: |
          curl -sS --max-time 120 --retry 2 --retry-delay 15 \
            https://albergue-api.onrender.com/healthz
